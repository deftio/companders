; PlatformIO example for companders library
;
; Build and upload:
;   pio run -t upload
;   pio device monitor
;
; To use companders in your own project, add one of these to your platformio.ini:
;   lib_deps = https://github.com/deftio/companders.git
; or if published to the PlatformIO registry:
;   lib_deps = companders

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
    companders=symlink://../../

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    companders=symlink://../../
